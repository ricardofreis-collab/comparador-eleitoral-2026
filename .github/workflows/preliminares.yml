name: Validar comparador TSE
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/preliminares.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_app.cjs && node tests/test_integration.cjs
